<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PasteShare | Privát & Biztonságos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap">
    <link rel="stylesheet" href="https://pasteshare.xo.je/core.css">
</head>
<body>
    <header>
        <div class="brand-container">
            <div class="title">PasteShare</div>
            <a href="https://pasteshare.xo.je" id="identity">Powered by PasteShare</a>
        </div>
        <button class="save-btn" id="saveTrigger">Mentés</button>
    </header>
    <main>
        <textarea id="editor" spellcheck="false" placeholder="Illeszd be a jegyzeted ide... (Ctrl + S a mentéshez)"></textarea>
    </main>
    <div id="notification">A link a vágólapon van!</div>
    <script src="https://pasteshare.xo.je/core.js"></script>
</body>
</html>
